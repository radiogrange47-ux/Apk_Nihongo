name: Publish Android release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install Android SDK 35
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate bundled question data
        run: python3 tools/package_questions.py --output "$RUNNER_TEMP/questions.zip"

      - name: Prepare release signing key
        env:
          NIHONGO_KEYSTORE_BASE64: ${{ secrets.NIHONGO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${NIHONGO_KEYSTORE_BASE64:?Configure the NIHONGO_KEYSTORE_BASE64 repository secret}"
          key_path="$RUNNER_TEMP/nihongo-release.jks"
          umask 077
          printf '%s' "$NIHONGO_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          test -s "$key_path"
          echo "NIHONGO_KEYSTORE_FILE=$key_path" >> "$GITHUB_ENV"

      - name: Test and build signed release APK
        id: build
        env:
          NIHONGO_KEYSTORE_PASSWORD: ${{ secrets.NIHONGO_KEYSTORE_PASSWORD }}
          NIHONGO_KEY_ALIAS: ${{ secrets.NIHONGO_KEY_ALIAS }}
          NIHONGO_KEY_PASSWORD: ${{ secrets.NIHONGO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${NIHONGO_KEYSTORE_PASSWORD:?Configure the NIHONGO_KEYSTORE_PASSWORD repository secret}"
          : "${NIHONGO_KEY_ALIAS:?Configure the NIHONGO_KEY_ALIAS repository secret}"
          : "${NIHONGO_KEY_PASSWORD:?Configure the NIHONGO_KEY_PASSWORD repository secret}"
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use the format vMAJOR.MINOR.PATCH."
            exit 1
          fi
          version="${tag#v}"
          chmod +x gradlew
          ./gradlew --no-daemon test assembleRelease \
            "-PappVersionName=$version" \
            "-PappVersionCode=$GITHUB_RUN_NUMBER"
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk_path"
          sha256sum "$apk_path" > "$apk_path.sha256"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.build.outputs.apk_path }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$APK_PATH" \
            "$APK_PATH.sha256" \
            --title "Nihongo $RELEASE_TAG" \
            --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nihongo-release.jks"
